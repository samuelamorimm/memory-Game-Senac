<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - One Piece</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Tela Inicial -->
    <div class="start-screen" id="start-screen">
        <div class="start-container">
            <div class="logo-container">
                <img src="./assets/imgs/logo.png" alt="One Piece Logo" class="main-logo">
                <h1>Jogo da Memória</h1>
            </div>
            <button class="start-button" id="start-button">
                <span>Começar Jornada</span>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Tela de Vitória -->
    <div class="win-screen" id="win-screen">
        <div class="win-container">
            <div class="win-content">
                <h2>Parabéns, Nakama!</h2>
                <p>Você completou o jogo da memória de One Piece!</p>
                
                <div class="stats-container">
                    <div class="stat-box">
                        <img src="./assets/imgs/time-icon.png" alt="Tempo">
                        <div>
                            <span class="stat-label">Tempo</span>
                            <span class="stat-value" id="final-time">00:00</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <img src="./assets/imgs/moves-icon.png" alt="Movimentos">
                        <div>
                            <span class="stat-label">Movimentos</span>
                            <span class="stat-value" id="final-moves">0</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <img src="./assets/imgs/quiz-icon.png" alt="Quiz">
                        <div>
                            <span class="stat-label">Acertos Quiz</span>
                            <span class="stat-value" id="final-quiz">0/0</span>
                        </div>
                    </div>
                </div>
                
                <div class="win-buttons">
                    <button class="win-btn" id="home-button">
                        <img src="./assets/imgs/home-icon.png" alt="Início">
                        Voltar ao Início
                    </button>
                    <button class="win-btn" id="save-button">
                        <img src="./assets/imgs/trophy-icon.png" alt="Salvar">
                        Salvar Pontuação
                    </button>
                </div>
            </div>
            <div class="win-image">
                <img src="./assets/imgs/win-image.png" alt="Luffy comemorando">
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div class="quiz-modal" id="quiz-modal">
        <div class="quiz-content">
            <h2 id="quiz-question">Pergunta</h2>
            <div class="quiz-options" id="quiz-options">
                <!-- Opções serão geradas dinamicamente -->
            </div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>
    </div>

    <!-- Área do Jogo -->
    <div class="game-container" id="game-container">
        <header class="game-header">
            <div class="header-content">
                <div class="logo-small">
                    <img src="./assets/imgs/logo-small.png" alt="One Piece Logo">
                </div>
                <div class="game-controls">
                    <button class="control-btn" id="restart-button">
                        <img src="./assets/imgs/restart-icon.png" alt="Reiniciar">
                        Reiniciar
                    </button>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="memory-board" id="memory-board">
                <!-- Cartas serão geradas dinamicamente -->
            </div>

            <aside class="game-info">
                <div class="info-card timer-card">
                    <div class="info-icon">
                        <img src="./assets/imgs/time-icon.png" alt="Tempo">
                    </div>
                    <div class="info-content">
                        <h3>Tempo</h3>
                        <p id="timer-display">00:00</p>
                    </div>
                </div>

                <div class="info-card moves-card">
                    <div class="info-icon">
                        <img src="./assets/imgs/moves-icon.png" alt="Movimentos">
                    </div>
                    <div class="info-content">
                        <h3>Movimentos</h3>
                        <p id="moves-display">0</p>
                    </div>
                </div>

                <div class="info-card pairs-card">
                    <div class="info-icon">
                        <img src="./assets/imgs/pairs-icon.png" alt="Pares">
                    </div>
                    <div class="info-content">
                        <h3>Pares</h3>
                        <p id="pairs-display">0/8</p>
                    </div>
                </div>
            </aside>
        </main>

        <aside class="hall-of-fame">
            <h2>Hall da Fama</h2>
            <div class="fame-list-container">
                <ol id="fame-list">
                    <li class="empty-message">Nenhum recorde ainda</li>
                </ol>
            </div>
        </aside>
    </div>

    <script src="./script.js"></script>
</body>
</html>
